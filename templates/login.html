<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | SMS Monitor</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #697386;
            --line: #dce3ed;
            --paper: #fff;
            --accent: #315c8a;
            --accent-dark: #25486d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(135deg, #edf5f4, #f7f1e8);
            font-family: Georgia, "Times New Roman", serif;
        }

        .login-shell {
            width: min(100%, 430px);
            padding: 42px;
            background: var(--paper);
            border: 1px solid rgba(49, 92, 138, .15);
            box-shadow: 0 22px 60px rgba(35, 54, 76, .14);
        }

        .mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            margin-bottom: 28px;
            color: #fff;
            background: var(--accent);
            font: 700 19px Georgia, serif;
        }

        h1 { margin: 0; font-size: 32px; line-height: 1.1; }
        .intro { margin: 10px 0 30px; color: var(--muted); font: 15px/1.5 system-ui, sans-serif; }
        label { display: block; margin: 18px 0 7px; font: 700 12px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
        input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); color: var(--ink); font: 15px system-ui, sans-serif; }
        input:focus { outline: 2px solid rgba(49, 92, 138, .22); border-color: var(--accent); }
        button { width: 100%; margin-top: 26px; padding: 13px; border: 0; color: #fff; background: var(--accent); cursor: pointer; font: 700 14px system-ui, sans-serif; }
        button:hover { background: var(--accent-dark); }
        #loginStatus { min-height: 22px; margin: 14px 0 0; color: var(--muted); text-align: center; font: 13px system-ui, sans-serif; }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="mark" aria-hidden="true">SMS</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to continue to the delivery monitor.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
            <p id="loginStatus" role="status"></p>
        </form>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("loginStatus").textContent =
                "Authentication is not configured yet.";
        });

        /*
        Connect this form when authentication is ready:
        fetch("/api/login", { method: "POST", body: new FormData(event.target) })
            .then(() => window.location.assign("/"));
        */
    </script>
</body>
</html>
