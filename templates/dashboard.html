<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SMS Delivery Monitor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <!-- LOGO -->

        <div class="logo">
            <span style="
                display:inline-flex;
                width:34px;
                height:34px;
                align-items:center;
                justify-content:center;
                margin-right:9px;
                border-radius:10px;
                background:rgba(99,102,241,.18);
                font-size:17px;
                vertical-align:middle;
            ">💬</span>

            <span style="vertical-align:middle;">
                SMS Monitor
            </span>
        </div>


        <!-- NAVIGATION -->

        <nav>

            <button
                id="overviewButton"
                class="nav-button active"
                onclick="showOverview()"
            >
                <span style="margin-right:8px;">📊</span>
                Overview
            </button>


            <button
                class="nav-button"
                onclick="showExportPanel()"
            >
                <span style="margin-right:8px;">📥</span>
                Export to Excel
            </button>

        </nav>


        <!-- EXTENSIONS -->

        <div class="section-title">
            Extensions
        </div>


        <div id="extensions">

            <div class="sidebar-loading">
                Loading...
            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div>

                <h1 id="page-title">
                    SMS Delivery Monitor
                </h1>


                <div id="page-subtitle">
                    Company overview
                </div>

            </div>


            <div style="
                display:flex;
                align-items:center;
                gap:12px;
            ">

                <div style="
                    display:flex;
                    align-items:center;
                    gap:7px;
                    padding:8px 11px;
                    border-radius:9px;
                    background:#ecfdf5;
                    color:#059669;
                    font-size:12px;
                    font-weight:650;
                ">

                    <span style="
                        width:7px;
                        height:7px;
                        border-radius:50%;
                        background:#10b981;
                        display:inline-block;
                    "></span>

                    Connected

                </div>


                <button
                    class="refresh"
                    onclick="refreshCurrentView()"
                >

                    🔄
                    <span>Refresh</span>

                </button>

            </div>

        </header>


        <!-- CONTENT -->

        <section id="content">

            <div class="loading">

                Loading...

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script
    src="{{ url_for('static', filename='dashboard.js') }}"
></script>


</body>

</html>
